name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN: "0.2.129"

jobs:
  rust:
    name: Rust — fmt, clippy, тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Тулчейн и компоненты — из rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Симуляция (2000 случайных прогонов)
        run: cargo run --release --locked -p selfsync-sim -- --runs 2000 --seed 1

  versions:
    name: Версии и манифест
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/version.mjs check

  plugin:
    name: Плагин — WASM, типы, линт Obsidian, e2e против сервера
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: wasm-bindgen и wasm-opt
        run: |
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked
          sudo apt-get update && sudo apt-get install -y binaryen
      - run: ./scripts/build-wasm.sh
      - run: cargo build --locked -p selfsync-server
      - working-directory: plugin
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

  install:
    name: Установка — install.sh и quickstart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh -n deploy/install.sh && shellcheck -s sh deploy/install.sh
      # Без systemd в контейнере: проверяется раскладка файлов, обновление с архивом
      # данных и то, что чужой Caddyfile не трогается. Бинарь не запускается.
      - name: install.sh в Debian, Ubuntu, Fedora
        run: |
          printf '#!/bin/sh\necho "selfsync 0.0.0"\n' > /tmp/selfsync && chmod +x /tmp/selfsync
          for image in debian:12 ubuntu:24.04 fedora:41; do
            docker run --rm -v "$PWD:/src:ro" -v /tmp/selfsync:/tmp/selfsync:ro -w /src "$image" sh -euc '
              command -v tar >/dev/null || dnf install -y -q tar
              sh deploy/install.sh --domain notes.example.test --binary /tmp/selfsync --version 0.0.0 --no-start
              test -x /usr/local/bin/selfsync -a -x /usr/local/bin/selfsync-admin
              for u in selfsync.socket selfsync.service selfsync-verify.timer selfsync-backup.timer selfsync-sweep.timer; do
                test -f /etc/systemd/system/$u
              done
              grep -q "SELFSYNC_PUBLIC_URL=https://notes.example.test" /etc/systemd/system/selfsync.service.d/install.conf
              grep -q "^notes.example.test {" /etc/caddy/Caddyfile
              mkdir -p /var/lib/private/selfsync && echo x > /var/lib/private/selfsync/server.db
              sh deploy/install.sh --domain notes.example.test --binary /tmp/selfsync --version 0.0.1 --no-start
              ls /root/selfsync-data-0.0.0-*.tgz && test -x /usr/local/bin/selfsync-0.0.0
              printf "my.site {\n\treverse_proxy 127.0.0.1:3000\n}\n" > /etc/caddy/Caddyfile
              sh deploy/install.sh --domain notes.example.test --binary /tmp/selfsync --version 0.0.1 --no-start
              grep -q my.site /etc/caddy/Caddyfile && test -f /etc/caddy/selfsync.caddy
            '
          done
      - name: quickstart — compose и образ из релиза
        working-directory: deploy/quickstart
        run: |
          cp .env.example .env
          sed -i "s/^SELFSYNC_VERSION=.*/SELFSYNC_VERSION=0.3.2/" .env
          docker compose config -q
          docker compose build selfsync
          docker run --rm selfsync-quickstart:0.3.2 --version

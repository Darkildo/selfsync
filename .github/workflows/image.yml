name: Image

# Образ сервера ghcr.io/darkildo/selfsync (linux/amd64 и linux/arm64) из бинарей
# опубликованного релиза server-X.Y.Z: deploy/quickstart/Dockerfile скачивает их
# и сверяет с SHA256SUMS. Запускается, когда релиз server-* опубликован (черновик
# бинари не отдаёт), или вручную — для уже опубликованного релиза.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия сервера X.Y.Z (релиз server-X.Y.Z должен быть опубликован)"
        required: true
      latest:
        description: "Поставить теги latest и X.Y (только для последней версии)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/darkildo/selfsync

jobs:
  image:
    name: Образ в GHCR
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'server-')
    runs-on: ubuntu-24.04
    steps:
      - name: Версия
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            latest="$INPUT_LATEST"
          else
            version="${TAG#server-}"
            latest=true
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "версия $version не в формате X.Y.Z" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.latest }}
            type=raw,value=latest,enable=${{ steps.v.outputs.latest }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/quickstart
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          push: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Образ запускается
        run: docker run --rm --platform linux/amd64 "$IMAGE:${{ steps.v.outputs.version }}" --version

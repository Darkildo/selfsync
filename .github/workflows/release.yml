name: Release

# Тег x.y.z (ровно версия из manifest.json, без «v» — так требует каталог плагинов
# Obsidian): бинари сервера и клиента (musl, x86_64 и aarch64), плагин, SHA256SUMS
# и аттестации происхождения; затем черновик релиза. Опубликовать его — вручную,
# после того как дописаны заметки к релизу.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN: "0.2.129"
  ZIGBUILD: "0.20.1"

jobs:
  versions:
    name: Тег совпадает с версией
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/version.mjs check "${{ github.ref_name }}"

  binaries:
    name: Бинари (${{ matrix.target }})
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Тулчейн и zig
        run: |
          rustup target add ${{ matrix.target }}
          pip install ziglang==0.13.0
          cargo install cargo-zigbuild --version "$ZIGBUILD" --locked
      - name: Воспроизводимая сборка
        env:
          # Время сборки и пути не попадают в бинарь: два прогона дают одинаковые байты.
          SOURCE_DATE_EPOCH: "0"
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=/home/runner/.cargo=cargo -C strip=symbols"
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.target }} -p selfsync-server -p selfsync-cli
          mkdir -p dist
          for bin in selfsync selfsync-cli; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$bin-${{ matrix.target }}"
          done
      - name: Проверка воспроизводимости (вторая сборка с нуля)
        env:
          SOURCE_DATE_EPOCH: "0"
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=/home/runner/.cargo=cargo -C strip=symbols"
        run: |
          cargo clean --release --target ${{ matrix.target }}
          cargo zigbuild --release --locked --target ${{ matrix.target }} -p selfsync-server -p selfsync-cli
          for bin in selfsync selfsync-cli; do
            cmp "target/${{ matrix.target }}/release/$bin" "dist/$bin-${{ matrix.target }}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  plugin:
    name: Плагин
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: wasm-bindgen и wasm-opt
        run: |
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked
          sudo apt-get update && sudo apt-get install -y binaryen
      - run: ./scripts/build-wasm.sh
      - working-directory: plugin
        run: |
          npm ci
          npm run lint
          npm run build
          mkdir -p ../dist
          # Каталог Obsidian скачивает эти три файла из релиза по отдельности.
          cp main.js styles.css ../dist/
          cp ../manifest.json ../dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: dist/*

  release:
    name: Черновики релизов
    needs: [binaries, plugin]
    runs-on: ubuntu-24.04
    steps:
      # Каталог Obsidian ждёт в релизе плагина только main.js, manifest.json и
      # styles.css, поэтому бинари уходят в отдельный релиз server-x.y.z.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin
          path: dist/plugin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: dist/server
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist/server
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/plugin/*
            dist/server/*
      - name: Релизы
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # Имя релиза плагина — ровно версия: так требует Obsidian. Тег server-x.y.z
        # создаётся на том же коммите при публикации черновика.
        run: |
          gh release create "$TAG" dist/plugin/* --draft --verify-tag --title "$TAG" --repo "$REPO"
          gh release create "server-$TAG" dist/server/* --draft --target "$GITHUB_SHA" --title "Server and CLI $TAG" --repo "$REPO" \
            --notes "Static Linux binaries (musl) of the selfsync server and command-line client for x86_64 and aarch64. The Obsidian plugin is in release $TAG."

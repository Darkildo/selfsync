# Два профиля:
#   docker compose --profile always up -d     — постоянный процесс
#   docker compose --profile ondemand up -d   — по требованию через Sablier
# Токен: docker compose run --rm selfsync token add --vault notes --name laptop
#
# Данные — bind mount ./data, а НЕ именованный volume: именованный volume стирается
# командой `docker compose down -v`, и вместе с ним — все заметки. Каталог должен
# принадлежать uid 65532 (nonroot в distroless):
#   mkdir -p data && sudo chown 65532:65532 data

x-selfsync: &selfsync
  image: ghcr.io/selfsync/selfsync:latest
  # Контекст — корень репозитория (собирается весь workspace); исключения —
  # в deploy/Dockerfile.dockerignore (BuildKit берёт файл рядом с Dockerfile).
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  mem_limit: 256m
  cpus: 1.0
  volumes:
    - ./data:/data
  environment:
    SELFSYNC_DATA_DIR: /data
    SELFSYNC_PUBLIC_URL: https://notes.example.com
    SELFSYNC_LOG: info
  # Порт наружу не публикуется: доступ только из сети обратного прокси.
  networks: [proxy]

services:
  selfsync:
    <<: *selfsync
    profiles: ["always"]
    restart: unless-stopped
    command: ["serve", "--listen", "0.0.0.0:8085"]

  selfsync-ondemand:
    <<: *selfsync
    profiles: ["ondemand"]
    # Контейнер останавливает Sablier после простоя; сам он может выйти и раньше.
    restart: "no"
    command: ["serve", "--listen", "0.0.0.0:8085", "--idle-timeout", "10m"]
    labels:
      - sablier.enable=true
      - sablier.group=selfsync

networks:
  proxy:
    external: true

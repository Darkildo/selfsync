# nginx + fcgiwrap: notesync как CGI-скрипт.
# Debian/Ubuntu: apt install fcgiwrap — пакет ставит fcgiwrap.socket, который тоже
# поднимается по требованию (systemctl enable --now fcgiwrap.socket).
# fcgiwrap запускает бинарь без аргументов — режим CGI включается по GATEWAY_INTERFACE.
# Каталог данных должен принадлежать пользователю fcgiwrap (обычно www-data):
#   sudo install -d -o www-data -g www-data -m 0700 /var/lib/notesync
#   sudo -u www-data NOTESYNC_DATA_DIR=/var/lib/notesync notesync token add --vault notes --name laptop
server {
    listen 443 ssl http2;
    server_name notes.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    location ~ ^/(v1|join)/ {
        # Согласовано с NOTESYNC_MAX_BODY_SIZE.
        client_max_body_size 17m;

        include fastcgi_params;
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_param SCRIPT_FILENAME /usr/local/bin/notesync;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param NOTESYNC_DATA_DIR /var/lib/notesync;
        fastcgi_param NOTESYNC_PUBLIC_URL https://notes.example.com;
        fastcgi_param NOTESYNC_LOG warn;
        fastcgi_param HTTPS on;

        # Большие тела — потоком, ответы (Range) — без буферизации.
        fastcgi_request_buffering off;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
